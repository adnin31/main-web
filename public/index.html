<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/arrai_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="description" content="Senior Full-Stack Engineer with 8+ years in fintech, e-commerce, and retail." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/arrai_logo.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Adnin Rais | Senior Full-Stack Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Apply saved/system theme before first paint to avoid a flash
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.classList.toggle('light', t === 'light');
    })();
  </script>
  <script>
    var v = function (name) { return 'rgb(var(--' + name + ') / <alpha-value>)'; };
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Unbounded', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            // Theme-aware tokens (values live in src/index.css)
            white: v('fg'),
            ink: { 950: v('ink-950'), 900: v('ink-900'), 800: v('ink-800'), 700: v('ink-700') },
            zinc: { 100: v('zinc-100'), 200: v('zinc-200'), 300: v('zinc-300'), 400: v('zinc-400'), 500: v('zinc-500'), 600: v('zinc-600') },
            amber: { 100: v('amber-100'), 300: v('amber-300'), 400: v('amber-400'), 500: '#f59e0b' },
            green: { 400: v('green-400'), 500: '#22c55e' },
            sky: { 300: v('sky-300'), 400: v('sky-400') },
            // Fixed brand color for filled buttons (same in both themes)
            brand: { DEFAULT: '#fbbf24', hover: '#fcd34d' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
